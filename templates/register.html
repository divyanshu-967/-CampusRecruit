{% extends 'layout.html' %}

{% block title %}Register - CampusRecruit{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border p-3">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary fs-1"></i>
                    <h3 class="fw-bold mt-2">Create Account</h3>
                    <p class="text-muted small">Register to join or lead campus societies</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Alex Johnson" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="alex@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" minlength="6" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label fw-semibold">Register As</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <select class="form-select" id="role" name="role" required>
                                <option value="student" selected>Student (Apply to societies)</option>
                                <option value="admin">Society Admin (Review and manage applicants)</option>
                            </select>
                        </div>
                        <div class="form-text">Choose 'Admin' if you represent an official student society.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Register Account
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center text-muted small">
                    Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
